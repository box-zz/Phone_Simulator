function imageData(value){return typeof value==='string' && /^data:image\/(png|jpeg|webp|gif);base64,[a-zA-Z0-9+/=\s]+$/.test(value)}

  if(!input || typeof input!=='object')throw Error('Invalid project');

function scenicSvg(){return `<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#b8d3d5"/><stop offset="1" stop-color="#f4e1c0"/></linearGradient><linearGradient id="water" x2="0" y2="1"><stop stop-color="#80b5b0"/><stop offset="1" stop-color="#377a78"/></linearGradient></defs><rect width="240" height="240" fill="url(#sky)"/><circle cx="177" cy="62" r="26" fill="#fff0ca" opacity=".9"/><path d="M0 111q65-16 123 2t117-4v131H0z" fill="url(#water)"/><path d="M0 169q66-24 104-17t94-4q-52 39-68 92H0z" fill="#e5d6af"/><path d="M0 179q69-27 110-19t88-12" fill="none" stroke="#f1f4e3" stroke-width="4"/><path d="M-10 153q37-27 53-24l23 24-12 13-31 4z" fill="#657961"/><path d="M177 112 157 145h20z" fill="#fffcf2"/><path d="M180 116v31h21z" fill="#ede4cc"/><path d="m154 149 49-1-8 7h-32z" fill="#496765"/><path d="M83 94q7-6 13 0m1 0q7-5 12 0" fill="none" stroke="#7b9993" stroke-width="1.4"/><path d="m5 229 39-13 34 4 26 20H0z" fill="#b9bd8d"/></svg>`}
function appMarkup(name,{dock=false,badge=true}={}){
  const config=APP[name];if(!config)return '';
  const folder=config.group;
  const icon=folder?`<span class="icon folder-icon">${config.group.slice(0,9).map(iconSvg).join('')}</span>`:`<span class="icon">${iconSvg(name)}</span>`;
  let count=badge?config.badge:0;if(name==='微信')count=badge?Math.min(99,state.messages.filter(m=>!m.me).length):0;
  return `<button class="app${dock?' dock-app':''}" aria-label="打开${esc(name)}" onclick="openApp('${name}')">${icon.replace('</span>',`${count?`<span class="badge">${count}</span>`:''}</span>`)}<span class="app-label">${esc(name)}</span></button>`;
}
function field(label,key,type='text'){return `<label class="field" for="field-${key}">${label}</label><input id="field-${key}" data-field="${key}" type="${type}" value="${esc(state[key])}">`}
function toggle(label,key){return `<label class="toggle-row">${label}<input type="checkbox" data-toggle="${key}" ${state[key]?'checked':''}></label>`}
function panel(){
  let html='';
  if(mode==='appearance')html=`<div class="section-title">壁纸 <small>WALLPAPER</small></div><div class="hint">柔和的色彩，让桌面内容成为主角。</div><div class="walls">${wallClasses.map((c,i)=>`<button class="wall ${c} ${state.wall===i&&!state.wallImage?'selected':''}" style="background-image:${wallpaperImage(i)}" aria-label="${['海边插画','暮色蓝调','林间光影'][i]}壁纸" onclick="chooseWall(${i})"></button>`).join('')}</div><button class="upload" onclick="uploadImage('wall')">＋ 上传自己的壁纸</button><div class="hint">JPG、PNG、WebP · 建议使用竖屏图片</div>${toggle('桌面壁纸模糊','blur')}${toggle('显示天气与照片小组件','widgets')}${toggle('显示音乐灵动岛','musicIsland')}<div class="divider"></div><div class="section-title">锁屏信息 <small>LOCK SCREEN</small></div><div class="row"><div>${field('显示时间','time','time')}</div><div>${field('显示日期','date')}</div></div>${field('锁屏寄语','message')}<div class="divider"></div><div class="section-title">天气小组件 <small>WIDGET</small></div><div class="row"><div>${field('城市','city')}</div><div>${field('温度 °C','temperature','number')}</div></div><div class="note">♧ 修改会自动保存在本地。<br>手机采用 393 × 852 画布，等比呈现桌面细节。</div>`;
  if(mode==='apps')html=`<div class="section-title">桌面应用 <small>HOME SCREEN</small></div><p class="hint">选择故事中的应用。第二页可通过左右滑动或页码圆点访问。</p><div class="app-options">${editableApps.map(name=>`<label class="app-option"><span class="mini-icon">${APP[name].group?iconSvg('设置'):iconSvg(name)}</span><span>${name}<div class="option-description">${['微信','日历','设置'].includes(name)?'第二页':'第一页'}${APP[name].group?' · 应用文件夹':''}</div></span><input type="checkbox" data-app="${name}" ${state.apps.includes(name)?'checked':''}></label>`).join('')}</div><div class="note">电话、信息和 Safari 固定在 Dock。微信启用时，也会显示在 Dock 中。</div>`;
  if(mode==='content')html=`<div class="section-title">微信聊天 <small>STORY</small></div>${field('聊天对象','contact')}<label class="field" for="messageInput">消息内容</label><textarea id="messageInput" rows="3" placeholder="写下故事的下一句…"></textarea><div class="row"><div><label class="field" for="sender">发送方</label><select id="sender"><option value="other">对方</option><option value="me">我</option></select></div><div style="display:flex;align-items:flex-end"><button class="primary" style="width:100%;font-size:11px" onclick="addMessage()">＋ 添加消息</button></div></div><div class="message-list">${state.messages.map((m,i)=>`<div class="message-entry"><span>${m.me?'我':'对方'}：${esc(m.text)}</span><button aria-label="删除消息 ${i+1}" onclick="removeMessage(${i})">×</button></div>`).join('')||'<div class="empty-editor">还没有消息，从一句问候开始。</div>'}</div><div class="divider"></div><div class="section-title">相册素材 <span class="count">${state.photos.length} 张</span></div><button class="upload" onclick="uploadImage('photo')">＋ 添加照片</button><div class="photo-thumbs">${state.photos.map((src,i)=>`<button class="thumbnail-remove" aria-label="移除照片 ${i+1}" onclick="removePhoto(${i})"><img src="${src}" alt="照片 ${i+1}"><span>×</span></button>`).join('')}</div><div class="hint">第一张照片将同步显示在桌面照片小组件中。</div><div class="divider"></div><div class="section-title">备忘录内容</div><label class="field" for="notes">写下故事的线索</label><textarea id="notes" data-field="notes" rows="3">${esc(state.notes)}</textarea><div class="content-actions"><button onclick="document.getElementById(&quot;importInput&quot;).click()">导入备份</button><button onclick="backup()">导出备份</button></div>`;
  $('#panel').innerHTML=html;
  document.querySelectorAll('[data-field]').forEach(input=>input.oninput=()=>{state[input.dataset.field]=input.value;save()});
  document.querySelectorAll('[data-toggle]').forEach(input=>input.onchange=()=>{state[input.dataset.toggle]=input.checked;save()});
  document.querySelectorAll('[data-app]').forEach(input=>input.onchange=()=>{state.apps=input.checked?[...state.apps,input.dataset.app]:state.apps.filter(name=>name!==input.dataset.app);save()});
}
function tab(next){if(isPublished)return;mode=next;document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('selected',b.dataset.tab===next);b.setAttribute('aria-selected',String(b.dataset.tab===next))});panel();if(next==='apps')setScreen('home')}
function chooseWall(index){state.wall=index;delete state.wallImage;save();panel()}
function wallpaperImage(index, uploadedImage){
  if(uploadedImage) return `url("${uploadedImage}")`;
  if(index === 0) return `url('data:image/svg+xml,${encodeURIComponent(scenicSvg())}')`;
  return '';
}
function render(){
  const screen=$('#screen');screen.classList.toggle('locked',page==='lock');screen.classList.remove('in-app');
  const wallpaper=$('#wallpaper');wallpaper.className='wallpaper '+wallClasses[state.wall]+(page==='home'&&state.blur?' home-blur':'');wallpaper.style.backgroundImage=wallpaperImage(state.wall,state.wallImage);
  $('#statusTime').textContent=state.time||'17:55';$('#statusIcons').innerHTML='<div class="status-icons"><svg class="wifi" viewBox="0 0 24 20" aria-label="Wi-Fi"><path d="M2 6q10-9 20 0M5.5 10q6.5-6 13 0M9 14q3-3 6 0"/><circle cx="12" cy="17" r="1" fill="white" stroke="none"/></svg><span class="battery" aria-label="低电量模式"></span></div>';
  $('#crumbName').textContent=state.title;$('#projectName').textContent=state.title;islandExpanded=false;renderIsland();
  $('#display').innerHTML=page==='lock'?lockMarkup():homeMarkup();
  $('#lockTab').classList.toggle('selected',page==='lock');$('#homeTab').classList.toggle('selected',page==='home');
}
function renderIsland(){const music=state.musicIsland&&page==='home';const island=$('#island');island.className='island'+(music?' music':'')+(islandExpanded?' expanded':'');island.innerHTML=(music||islandExpanded?'<span class="cover">♫</span>':'')+(islandExpanded?`<span class="island-copy"><b>${esc(state.title)}</b>故事模式 · 正在探索</span>`:'')+(music?'<span class="wave"><i></i><i></i><i></i><i></i><i></i></span>':'')}
function toggleIsland(){islandExpanded=!islandExpanded;renderIsland()}
function lockMarkup(){return `<div class="lock-view"><svg class="lock-symbol" viewBox="0 0 24 26" aria-hidden="true"><rect x="5" y="11" width="14" height="13" rx="3"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><div class="lock-date">${esc(state.date)}</div><div class="lock-time">${esc(state.time)}</div><div class="lock-message">${esc(state.message)}</div><div class="lock-actions"><button aria-label="手电筒" onclick="toggleFlash(this)">${smallSvg('<path d="M8 3h8v6l-2 3v9h-4v-9L8 9zM8 7h8M11 14h2"/>')}</button><button aria-label="打开相机" onclick="openApp('相机')">${cameraSvg()}</button></div><button class="unlock" onclick="setScreen('home')">轻点或向上滑动解锁</button></div>`}
function homeMarkup(){
  const first=firstPageOrder.filter(name=>state.apps.includes(name));
  const second=state.apps.filter(name=>!firstPageOrder.includes(name));
  if(!second.length)homePage=0;
  const names=homePage===0?first:second;
  const widget=homePage===0&&state.widgets?`<div class="widgets"><div class="widget-wrap"><button class="widget weather-widget" onclick="openApp('天气')" aria-label="天气小组件"><div class="weather-city">${esc(state.city)} <span style="font-size:11px">➤</span></div><div class="weather-temp">${esc(state.temperature)}°</div><div class="weather-sun">${sunSvg()}</div><div class="weather-summary">大部晴朗</div><div class="weather-range">最高18°　最低9°</div></button><div class="widget-label">天气</div></div><div class="widget-wrap"><button class="widget photo-widget" onclick="openApp('相册')" aria-label="照片小组件">${state.photos[0]?`<img src="${state.photos[0]}" alt="相册精选">`:scenicSvg()}<span class="photo-badge">夏日回忆</span></button><div class="widget-label">照片</div></div></div>`:'';
  return `<div class="home-page" data-page="${homePage}">${widget}<div class="grid ${homePage||!state.widgets?'second':''}">${names.map(name=>appMarkup(name)).join('')}</div>${second.length?`<div class="page-dots" aria-label="桌面分页"><button class="${homePage===0?'selected':''}" aria-label="第一页" onclick="changeHomePage(0)"></button><button class="${homePage===1?'selected':''}" aria-label="第二页" onclick="changeHomePage(1)"></button></div>`:''}<button class="search-pill" onclick="openSearch()" aria-label="搜索应用">${searchSvg()}搜索</button><div class="dock">${['电话','信息',...(state.apps.includes('微信')?['微信']:[]),'Safari'].map(name=>appMarkup(name,{dock:true})).join('')}</div></div>`;
}
function setScreen(next){page=next;if(next==='lock')homePage=0;render()}
function changeHomePage(index){page='home';homePage=index;render()}
function goHome(){if(page==='lock'){setScreen('home');return}if($('#screen').classList.contains('in-app')){render();return}if(homePage){changeHomePage(0);return}islandExpanded=false;renderIsland()}
function toggleFlash(button){const on=button.dataset.on!=='true';button.dataset.on=String(on);button.style.background=on?'#fff':'#1118';button.style.color=on?'#111':'white'}
function clearApp(){document.querySelectorAll('.app-page,.folder-overlay').forEach(e=>e.remove());$('#screen').classList.remove('in-app')}
function showApp(title,body,extraClass=''){
  clearApp();islandExpanded=false;renderIsland();$('#screen').classList.add('in-app');
  const app=document.createElement('section');app.className='app-page '+extraClass;app.innerHTML=`<div class="app-head"><button onclick="closeApp()" aria-label="返回桌面">${smallSvg('<path d="m16 3-9 9 9 9"/>')}返回</button><b>${esc(title)}</b><span>•••</span></div>${body}`;$('#display').append(app);return app;
}
function closeApp(){if(page==='lock')setScreen('lock');else render()}
function openApp(name){

const storyPanel = panel;
let editedConversation = '';
let expandedMessage = -1;
panel = function(){
  storyPanel();
  if(mode !== 'content' || storySection !== 'chatLines') return;
  const chats = state.story.chats.filter(chat=>chat.name);
  const lines = state.story.chatLines;
  const names = [...new Set([...chats.map(chat=>chat.name), ...lines.map(line=>line.chat)])];
  if(!names.includes(editedConversation)) editedConversation = names[0] ?? '';
  const chat = chats.find(item=>item.name===editedConversation);
  const rows = lines.map((line,index)=>({line,index})).filter(({line})=>line.chat===editedConversation);
  const list = $('.story-records');
  const picker = document.createElement('label');
  picker.className = 'field';
  picker.innerHTML = '选择会话<select aria-label="选择会话">'+names.map(name=>'<option value="'+esc(name)+'">'+esc(name||'未分配会话')+'</option>').join('')+'</select>';
  list.previousElementSibling.replaceWith(picker);
  picker.querySelector('select').value = editedConversation;
  picker.querySelector('select').onchange = event=>{
    editedConversation = event.target.value;
    expandedMessage = -1;
    panel();
    previewStory();
  };
  const types = ['文字','图片','语音','引用','系统','位置','链接','文件','通话','红包','转账'];
  const senders = [...new Set(['我',chat?.name,...(chat?.members||'').split(/[、,，]/).map(name=>name.trim())].filter(Boolean))];
  const extraFields = {图片:[['photo','相册照片']],语音:[['duration','时长（秒）']],引用:[['quote','引用内容']],位置:[['title','地点名称']],链接:[['title','链接标题']],文件:[['title','文件名']],通话:[['duration','通话时长']],红包:[['amount','金额'],['status','领取状态']],转账:[['amount','金额'],['status','转账状态']]};
  list.innerHTML = '<datalist id="storySenders">'+senders.map(name=>'<option value="'+esc(name)+'">').join('')+'</datalist>';
  list.insertAdjacentHTML('beforeend', rows.map(({line,index},position)=>{
    const type = line.type || '文字';
    const field = (key,label,control)=>'<label class="field">'+label+control+'</label>';
    const attrs = key=>' data-message-field="'+key+'"';
    const input = (key,label,extra='')=>field(key,label,'<input'+attrs(key)+' value="'+esc(line[key]||'')+'" '+extra+'>');
    const options = (entries,current)=>entries.map(([value,label])=>'<option value="'+esc(value)+'" '+(String(value)===String(current)?'selected':'')+'>'+esc(label)+'</option>').join('');
    const extra = (extraFields[type]||[]).map(([key,label])=>key==='photo'
      ?field(key,label,'<select'+attrs(key)+'>'+options([['','选择已上传的照片'],...state.photos.map((_,i)=>[i+1,'照片 '+(i+1)])],line.photo||'')+'</select>')
      :input(key,label)).join('');
    return '<details class="story-record" data-line="'+index+'" '+(expandedMessage===index?'open':'')+'><summary>'+esc([line.time,type,line.sender,line.text].filter(Boolean).join(' · ').slice(0,90))+'</summary>'
      +field('type','消息类型','<select'+attrs('type')+'>'+options(types.map(value=>[value,value]),type)+'</select>')
      +(type==='系统'?'':input('sender','发送者','list="storySenders"'))
      +input('time','消息时间（可留空）')+field('text',type==='系统'?'系统提示 / 时间分隔文字':'正文或说明','<textarea rows="3"'+attrs('text')+'>'+esc(line.text||'')+'</textarea>')+extra
      +'<div class="content-actions"><button data-edit="up" '+(position===0?'disabled':'')+'>上移</button><button data-edit="down" '+(position===rows.length-1?'disabled':'')+'>下移</button><button data-edit="copy">复制</button><button data-edit="delete">删除</button></div></details>';
  }).join('') || '<p class="hint">暂无消息。选择会话后可添加新消息。</p>');
  list.querySelectorAll('[data-line]').forEach(card=>{
    const index = Number(card.dataset.line);
    card.querySelectorAll('[data-message-field]').forEach(control=>control.onchange=()=>{
      const line = lines[index];
      const key = control.dataset.messageField;
      line[key] = control.value;
      expandedMessage = index;
      save();
      if(key==='type') panel();
      else card.querySelector('summary').textContent = [line.time,line.type||'文字',line.sender,line.text].filter(Boolean).join(' · ').slice(0,90);
      previewStory();
    });
    card.querySelectorAll('[data-edit]').forEach(button=>button.onclick=()=>{
      const action = button.dataset.edit;
      expandedMessage = index;
      if(action==='copy'){
        lines.splice(index+1,0,{...lines[index]});
        expandedMessage = index+1;
      }else if(action==='delete'){
        if(!confirm('删除这条消息？')) return;
        lines.splice(index,1);
        expandedMessage = -1;
      }else{
        const position = rows.findIndex(item=>item.index===index);
        const neighbor = rows[position+(action==='up'?-1:1)];
        if(!neighbor) return;
        [lines[index],lines[neighbor.index]] = [lines[neighbor.index],lines[index]];
        expandedMessage = neighbor.index;
      }
      save();
      panel();
      previewStory();
    });
  });
  const add = list.nextElementSibling;
  add.disabled = !editedConversation;
  add.onclick = ()=>{
    expandedMessage = lines.length;
    lines.push({chat:editedConversation,sender:'我',text:'',time:'',type:'文字'});
    save();
    panel();
    previewStory();
    listForMessage(expandedMessage)?.querySelector('textarea')?.focus();
  };
};
function listForMessage(index){
  return document.querySelector('[data-line="'+index+'"]');
}
const previewStoryModule = previewStory;
previewStory = function(){
  if(storySection==='chatLines'){
    const index = state.story.chats.findIndex(chat=>chat.name===editedConversation);
    if(index>=0){
      page='home';
      openStoryChat(index);
      return;
    }
  }
  previewStoryModule();
};
state=readProject();ensureStory();
panel();render();
</script>
