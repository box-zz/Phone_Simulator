<script id="studioScript">const $ = selector => document.querySelector(selector);
const APP = {
  '相册': {icon:'photos'}, '备忘录': {icon:'notes'},

  '天气': {icon:'weather'}, 'FaceTime': {icon:'facetime'}, '邮件': {icon:'mail'},
  '健康': {icon:'health'}, '钱包': {icon:'wallet'}
};
const firstPageOrder = ['相册','备忘录','时钟','App Store','手记','音乐'];
const editableApps = [...firstPageOrder,'微信','日历'];
const initial = {version:2,title:'夏日来信',wall:0,wallFit:'contain',time:'17:55',date:'6月21日 星期五',message:'把日子过成喜欢的样子',blur:true,widgets:true,musicIsland:true,apps:[...editableApps],contact:'林间晚风',messages:[{text:'夏天到了，一起去看海吧。',me:false},{text:'好呀！把这一天收藏起来 ☀',me:true}],photos:[],photoDates:[],photoFavorites:[],journal:[],alarms:[],notes:'海边的风，傍晚的云，还有值得收藏的每一天。',city:'海淀区',temperature:'15',passcode:''};

function imageData(value){return typeof value==='string' && /^data:image\/(png|jpeg|webp|gif);base64,[a-zA-Z0-9+/=\s]+$/.test(value)}
function normalizeProject(input){
  if(!input || typeof input!=='object')throw Error('Invalid project');
  const out=cloneProject(initial);
  for(const key of ['title','time','date','message','contact','notes','city','temperature'])if(typeof input[key]==='string')out[key]=input[key].slice(0,key==='notes'?30000:500);
  if(typeof input.passcode==='string')out.passcode=input.passcode.replace(/\D/g,'').slice(0,6);
  if(Number.isInteger(input.wall)&&input.wall>=0&&input.wall<3)out.wall=input.wall;
  for(const key of ['blur','widgets','musicIsland'])if(typeof input[key]==='boolean')out[key]=input[key];
  if(Array.isArray(input.apps))out.apps=[...new Set(input.apps.filter(name=>editableApps.includes(name)))];
  if(input.version!==2 && Array.isArray(input.apps))out.apps=[...new Set([...out.apps,...firstPageOrder.filter(name=>!['相册','备忘录','音乐'].includes(name))])];
  if(Array.isArray(input.messages))out.messages=input.messages.filter(m=>m&&typeof m.text==='string').map(m=>({text:m.text.slice(0,10000),me:!!m.me})).slice(0,500);
  if(Array.isArray(input.photos))out.photos=input.photos.filter(imageData).slice(0,60);
  if(Array.isArray(input.photoDates))out.photoDates=input.photoDates.map(d=>/^\d{4}-\d{2}-\d{2}$/.test(String(d))?String(d):'').slice(0,60);
  if(Array.isArray(input.photoFavorites))out.photoFavorites=input.photoFavorites.map(f=>!!f).slice(0,60);

  out.wallFit=['contain','cover'].includes(input.wallFit)?input.wallFit:'contain';

function openCalendarStory(){
  ensureCalendar();
  const m=/(\d+)月(\d+)日/.exec(state.date);const curMonth=m?+m[1]:6,curDay=m?+m[2]:21;
  const year=new Date().getFullYear();
  const evDate=e=>{const em=/(\d+)月(\d+)日/.exec(e.time||'');return em?{m:+em[1],d:+em[2]}:null};
  const monthBlock=(y,mo)=>{
    const first=new Date(y,mo-1,1),startDow=first.getDay(),days=new Date(y,mo,0).getDate();
    let cells=['日','一','二','三','四','五','六'].map(d=>`<span class="dow">${d}</span>`).join('');
    for(let i=0;i<startDow;i++)cells+='<span></span>';
    for(let d=1;d<=days;d++){const dayEvs=state.story.events.filter(e=>{const ed=evDate(e);return ed&&ed.m===mo&&ed.d===d});const cls=`cal-day ${(y===year&&mo===curMonth&&d===curDay)?'today':''} ${dayEvs.length?'dot':''}`;cells+=dayEvs.length?`<button class="${cls}" tabindex="-1" onmousedown="event.preventDefault()" onclick="calDayCard(event,${y},${mo},${d})">${d}</button>`:`<span class="${cls}">${d}</span>`}
    return `<div class="cal-month" id="cal-${y}-${mo}" style="margin-bottom:18px"><div class="cal-head"><b>${mo}月</b><span>${y}年</span></div><div class="cal-grid">${cells}</div></div>`;
  };
  let blocks='';
  for(let y=year-1;y<=year+1;y++)for(let mo=1;mo<=12;mo++)blocks+=monthBlock(y,mo);
  const evts=state.story.events.map((e,i)=>`<button class="ios-row cal-evt" onclick="openCalEvent(${i})"><span class="dot"></span><span style="flex:1;min-width:0"><b style="display:block;font-size:15px">${esc(e.title)}</b><p style="margin:1px 0 0;font-size:12px;color:#8e8e93">${esc([e.time,e.place].filter(Boolean).join(' · '))}</p></span><i>›</i></button>`).join('');
  showApp('日历',`${blocks}${evts?`<div class="ios-h3">日程</div><div class="ios-group">${evts}</div>`:'<p class="rem-hint">点右上角 ＋ 添加日程</p>'}`,'cal-app');
  const fb=document.createElement('div');fb.className='cal-float';
  fb.innerHTML='<button class="pv-round" onclick="closeApp()" aria-label="返回">‹</button><button class="pv-round" style="font-size:17px" onclick="openCalCompose()" aria-label="添加日程">＋</button>';
  $('#screen').append(fb);

function calDayCard(ev,y,mo,d){
  ensureCalendar();
  document.querySelectorAll('.cal-card').forEach(e=>e.remove());
  const cell=ev.currentTarget,app=document.querySelector('.app-page');
  const dayEvs=state.story.events.filter(e=>{const em=/(\d+)月(\d+)日/.exec(e.time||'');return em&&+em[1]===mo&&+em[2]===d});
  if(!dayEvs.length||!app)return;
  const card=document.createElement('div');card.className='cal-card';
  card.innerHTML=`<div class="cal-card-head"><b>${mo}月${d}日</b><span>${y}年</span></div>`+dayEvs.map(e=>{
    const tm=/\d{1,2}:\d{2}/.exec(e.time||'');
    const sub=[tm?tm[0]:'',e.place||''].filter(Boolean).join(' · ');
    return `<button class="cal-card-evt" onclick="openCalEvent(${state.story.events.indexOf(e)})"><span class="dot"></span><span style="flex:1;min-width:0"><b>${esc(e.title)}</b>${sub?`<p>${esc(sub)}</p>`:''}</span><i style="color:#c7c7cc">›</i></button>`;
  }).join('');
  app.appendChild(card);
  const cr=cell.getBoundingClientRect(),ar=app.getBoundingClientRect(),cw=card.offsetWidth,st=app.scrollTop;
  const sx=ar.width/app.clientWidth||1;
  let left=(cr.left+cr.width/2-ar.left)/sx-cw/2;
  left=Math.max(10,Math.min(left,app.clientWidth-cw-10));
  let top=st+(cr.bottom-ar.top+8)/sx;
  if(top+card.offsetHeight>app.scrollHeight-14)top=st+(cr.top-ar.top)/sx-card.offsetHeight-8;
  card.style.left=left+'px';card.style.top=Math.max(58,top)+'px';
  app.addEventListener('scroll',()=>document.querySelectorAll('.cal-card').forEach(e=>e.remove()),{once:true});
  setTimeout(()=>document.addEventListener('click',()=>document.querySelectorAll('.cal-card').forEach(e=>e.remove()),{once:true}));
}

function sizeViewer(){
  if(!document.body.classList.contains('immersive')) return;
  const viewport = $('.viewport');
  const scale = Math.min(1, viewport.clientHeight / 852, viewport.clientWidth / 393);
  if(scale <= 0) return;
  const style = document.body.style;
  style.setProperty('--viewer-scale', scale);
  style.setProperty('--viewer-width', (viewport.clientWidth / scale) + 'px');
  style.setProperty('--viewer-height', (viewport.clientHeight / scale) + 'px');
}
window.addEventListener('resize',sizeViewer);
function preview(fullscreen = true){

  state = cloneProject(previewOriginal);
  document.body.classList.add('immersive');
  sizeViewer();
  setScreen('lock');
  if(fullscreen && !document.fullscreenElement){
    document.documentElement.requestFullscreen?.().catch(()=>{});

}
function exitPreview(){
  if(isPublished || !previewOriginal) return;
  state = previewOriginal;
  previewOriginal = null;

}

async function prepareImage(file,maxSide=2560){
  if(!file||!(/^image\/(jpeg|png|webp|gif|bmp|avif)$/.test(file.type)||/\.(jpe?g|png|webp|gif|bmp|avif)$/i.test(file.name)))throw Error('请选择 JPG、PNG、WebP、GIF、BMP 或 AVIF 图片；HEIC 请先转换为 JPG');

    img.src=url;await img.decode();
    const scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
    const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
    canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
    return canvas.toDataURL('image/webp',.88);

let chatDraftImport=[],chatImportUndo=null,chatSpeaker='我';
function parseChatScript(text){
 const rows=[],errors=[];let time='';
 if(/^\s*(?:\[\s*\{|\[\s*\]|\{)/.test(text)){
  const data=JSON.parse(text),list=Array.isArray(data)?data:data.messages;
  if(!Array.isArray(list))throw Error('JSON 应为消息数组，或包含 messages 数组');
  list.forEach((m,i)=>{if(!m||typeof m.sender!=='string'||typeof m.text!=='string'||!m.sender.trim()||!m.text.trim())errors.push(i+1);else rows.push({sender:m.sender.trim(),text:m.text,time:String(m.time||''),type:'文字'})});
 }else text.replace(/\r/g,'').split('\n').forEach((raw,i)=>{
  const line=raw.trim();if(!line)return;
  if(/^(?:\d{4}[-/]\d{1,2}[-/]\d{1,2}\s+)?\d{1,2}:\d{2}(?::\d{2})?$/.test(line)){time=line;return}
  const m=line.match(/^(?:\[([^\]]+)\]\s*)?([^:：\n]{1,60})[:：]\s*(.*)$/);
  if(m){rows.push({sender:m[2].trim(),text:m[3],time:m[1]||time,type:'文字'});time='';}
  else if(rows.length){rows.at(-1).text+='\n'+raw;}
  else errors.push(i+1);
 });
 return {rows,errors};
}

 }catch(e){$('#chatParseResult').textContent=e.message}};

 if(type!=='语音'){voiceComposeBase(type);return}
 const index=activeStoryChat,sender=wxAuthorSender();
 const sheet=wxInlineSheet('添加语音消息','<form id="wxVoiceForm"><label>时长（秒）<input name="seconds" type="number" min="1" max="60" step="1" value="10" required></label><label>语音文字（可选）<textarea name="text" rows="3" placeholder="点击语音气泡时展开这段文字"></textarea></label><p>制作语音消息外观，不会生成真实录音。</p><button type="submit" class="primary">添加到聊天</button></form>');
 sheet.querySelector('form').onsubmit=e=>{e.preventDefault();wxStoreMessage(index,sender,'语音',e.target.elements.text.value,{duration:e.target.elements.seconds.value})};
};

function wxLocationMap(){return '<svg viewBox="0 0 240 112" aria-label="地图示意图" role="img"><rect width="240" height="112" fill="#e9ede6"/><path d="M0 70 70 40l45 72H0M154 0h86v44l-47 14z" fill="#d3e3cb"/><path d="M180-10q-42 50-11 76t-1 56" fill="none" stroke="#badce9" stroke-width="19"/><path d="M-10 27 250 83M47-10 92 122M-10 102 250 13" fill="none" stroke="#d4d6cd" stroke-width="13"/><path d="M-10 27 250 83M47-10 92 122M-10 102 250 13" fill="none" stroke="#fff" stroke-width="9"/><ellipse cx="122" cy="77" rx="11" ry="4" fill="#0002"/><path d="M122 77s-14-17-14-27a14 14 0 0 1 28 0c0 10-14 27-14 27z" fill="#e65b51" stroke="#fff" stroke-width="2"/><circle cx="122" cy="50" r="4.5" fill="white"/></svg>'}
const locationMessageBase=wxMsgHtml;
wxMsgHtml=function(m){
 if(m.type!=='位置')return locationMessageBase(m);
 const image=(state.story.avatars||[])[Number(m.photo)-1];
 return `<div class="wx-location-card"><div class="wx-location-caption"><strong>${esc(m.title||'位置信息')}</strong><span>${esc(m.text||'未填写详细地址')}</span></div><div class="wx-location-map">${image?`<img src="${image}" alt="${esc(m.title||'位置')}地图预览">`:wxLocationMap()}</div></div>`;
};
const locationComposeBase=wxComposeType;
wxComposeType=function(type){
 if(type!=='位置'){locationComposeBase(type);return}
 const index=activeStoryChat,sender=wxAuthorSender();
 const sheet=wxInlineSheet('发送位置','<form id="wxLocationForm"><label>地点名称<input name="place" required maxlength="80" placeholder="例如：虹桥火车站"></label><label>详细地址<input name="address" required maxlength="200" placeholder="填写街道、门牌或楼层"></label><label>地图截图（可选）<input name="map" type="file" accept="image/*"></label><p>可直接上传电脑里的地图截图；未上传时使用示意图，不代表实际坐标。</p><button type="submit" class="primary">发送位置</button></form>');
 if(!sheet)return;
 sheet.querySelector('form').onsubmit=async e=>{
  e.preventDefault();const f=e.target.elements,title=f.place.value.trim(),address=f.address.value.trim();if(!title||!address)return toast('请填写地点名称和详细地址');
  const button=e.submitter;button.disabled=true;
  try{let photo='';const file=f.map.files[0];if(file){if((state.story.avatars||[]).length>=300)throw Error('图片素材已达到上限，请先整理素材');const src=await prepareImage(file,1200);if(!state.story.avatars)state.story.avatars=[];state.story.avatars.push(src);photo=String(state.story.avatars.length)}wxStoreMessage(index,sender,'位置',address,{title,photo});}catch(err){toast(err.message)}finally{button.disabled=false}
 };
};

const timeComposeBase=wxComposeType;
wxComposeType=function(type){
 if(type!=='添加时间'){timeComposeBase(type);return}
 wxEditTimeMarker();
};
function wxEditTimeMarker(messageIndex){
 const old=Number.isInteger(messageIndex)?state.story.chatLines[messageIndex]:null;
 const chatIndex=activeStoryChat;
 const sheet=wxInlineSheet(old?'编辑时间':'添加时间',`<form id="wxTimeMarkerForm"><label>时间标记<input name="label" aria-label="时间标记" maxlength="100" required placeholder="例如：昨天 17:46" value="${esc(old?.text||state.time||'')}"></label><p>在聊天中插入一条居中的时间，之后发送的消息不会自动重复显示时间。</p><button type="submit" class="primary">${old?'保存时间':'插入时间'}</button>${old?'<button type="button" id="wxRemoveTimeMarker">删除这条时间</button>':''}</form>`);
 if(!sheet)return;
 sheet.querySelector('form').onsubmit=e=>{
  e.preventDefault();const text=e.target.elements.label.value.trim();
  if(!text)return toast('请填写时间');
  if(old){old.text=text;old.time='';save();openStoryChat(chatIndex)}
  else wxStoreMessage(chatIndex,'','系统',text,{title:'时间标记',time:''});
 };
 if(old)sheet.querySelector('#wxRemoveTimeMarker').onclick=()=>{state.story.chatLines.splice(messageIndex,1);save();openStoryChat(chatIndex)};
 sheet.querySelector('input').focus();
}
const timeMarkerChatBase=openStoryChat;
openStoryChat=function(index,query=''){
 timeMarkerChatBase(index,query);
 if(isPublished)return;
 document.querySelectorAll('[data-time-marker]').forEach(el=>{
  const edit=()=>wxEditTimeMarker(Number(el.dataset.timeMarker));
  el.setAttribute('role','button');el.setAttribute('tabindex','0');el.setAttribute('aria-label','编辑时间：'+el.textContent);
  el.onclick=edit;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();edit()}};
 });
};

state=readProject();ensureStory();
panel();render();
restoreMediaProject();
</script>
</body></html>
